name: 02-Render-and-inline-newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year"
        required: true
      issue:
        description: "Issue"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Quarto CLI (cached, fast)
      - uses: quarto-dev/quarto-actions/setup@v2

      # Node.js (for juice)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render and inline
        run: |
          scripts/inline_issue.sh \
            "${{ github.event.inputs.year }}" \
            "${{ github.event.inputs.issue }}"

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues/
          git commit -m "Render newsletter ${{ github.event.inputs.year }}/${{ github.event.inputs.issue }}" || echo "Nothing to commit"
          git push
