name: Render and inline newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year"
        required: true
      issue:
        description: "Issue"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Quarto CLI
      - uses: quarto-dev/quarto-actions/setup@v2

      # Setup base R
      - uses: r-lib/actions/setup-r@v2

      # Install ONLY required R packages
      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("readr","juicyjuice"), repos="https://cloud.r-project.org")'

      - name: Render and inline
        run: |
          Rscript -e '
            source("scripts/inline_issue.R")
            inline_issue(
              year  = "${{ github.event.inputs.year }}",
              issue = "${{ github.event.inputs.issue }}"
            )
          '

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues/
          git commit -m "Render newsletter ${{ github.event.inputs.year }}/${{ github.event.inputs.issue }}" || echo "Nothing to commit"
          git push
