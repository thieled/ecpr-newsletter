name: Render and inline newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year"
        required: true
      issue:
        description: "Issue"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            quarto
            readr
            juicyjuice

      - name: Render and inline
        run: |
          Rscript -e '
            source("scripts/new_issue_helpers.R")
            inline_issue(
              year = "${{ github.event.inputs.year }}",
              issue = "${{ github.event.inputs.issue }}"
            )
          '

      - name: Commit output
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add issues/
          git commit -m "Render newsletter ${{ github.event.inputs.year }}/${{ github.event.inputs.issue }}" || echo "Nothing to commit"
          git push
