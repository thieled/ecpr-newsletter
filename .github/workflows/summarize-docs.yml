name: Summarize uploaded documents

on:
  push:
    branches:
      - main
    paths:
      - "issues/**/doc/**/*.doc"
      - "issues/**/doc/**/*.docx"
      - "issues/**/doc/**/*.txt"
      - "issues/**/doc/**/*.pdf"

permissions:
  contents: write
  models: read

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pypdf tiktoken azure-ai-inference

      - name: Detect changed documents
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E '^issues/.*/doc/.*\.(doc|docx|pdf|txt)$' \
            > changed_files.txt || true

          if [ ! -s changed_files.txt ]; then
            echo "No relevant documents changed."
            exit 0
          fi

          cat changed_files.txt

      - name: Summarize documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/summarize_docs.py changed_files.txt

      - name: Commit summaries
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add issues/**/doc/*_summary.md || true

          if git diff --cached --quiet; then
            echo "No summaries to commit."
            exit 0
          fi

          git commit -m "Add newsletter summaries for uploaded documents"
          git push
