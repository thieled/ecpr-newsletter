name: 01-Crop-image

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Repo path to image (e.g. issues/2025/20/img/krakow.webp)"
        required: true
      output_path:
        description: "Optional output path (e.g. issues/2025/20/img/krakow_sq.png)"
        required: false
      offset_x_adj:
        description: "Horizontal offset (pixels, can be negative)"
        required: false
        default: "0"
      offset_y_adj:
        description: "Vertical offset (pixels, can be negative)"
        required: false
        default: "0"

jobs:
  crop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Crop image to square
        run: |
          set -e

          INPUT="$(echo "${{ github.event.inputs.input_path }}" | tr -d '\r\n' | xargs)"
          OUTPUT="$(echo "${{ github.event.inputs.output_path }}" | tr -d '\r\n' | xargs)"

          OFFSET_X="${{ github.event.inputs.offset_x_adj }}"
          OFFSET_Y="${{ github.event.inputs.offset_y_adj }}"

          if [ ! -f "$INPUT" ]; then
            echo "Input image does not exist: $INPUT"
            exit 1
          fi

          if [ -z "$OUTPUT" ]; then
            BASE="${INPUT%.*}"
            OUTPUT="${BASE}_sq.png"
          fi

          # Get dimensions (IM6)
          WIDTH=$(identify -format "%w" "$INPUT")
          HEIGHT=$(identify -format "%h" "$INPUT")

          SIZE=$(( WIDTH < HEIGHT ? WIDTH : HEIGHT ))

          OFFSET_X=$(( (WIDTH  - SIZE) / 2 + OFFSET_X ))
          OFFSET_Y=$(( (HEIGHT - SIZE) / 2 + OFFSET_Y ))

          # Clamp offsets
          OFFSET_X=$(( OFFSET_X < 0 ? 0 : OFFSET_X ))
          OFFSET_Y=$(( OFFSET_Y < 0 ? 0 : OFFSET_Y ))

          echo "Cropping ${SIZE}x${SIZE}+${OFFSET_X}+${OFFSET_Y}"

          convert "$INPUT" \
            -crop "${SIZE}x${SIZE}+${OFFSET_X}+${OFFSET_Y}" \
            +repage \
            "$OUTPUT"

          echo "Saved cropped image: $OUTPUT"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues/
          git commit -m "Crop image $(basename "${{ github.event.inputs.input_path }}")" || echo "Nothing to commit"
          git push
