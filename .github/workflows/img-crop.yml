name: 01-Crop-image

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Path to input image (e.g. issues/2025/20/img/krakow.webp)"
        required: true
      output_path:
        description: "Optional output path (e.g. issues/2025/20/img/krakow_sq.png)"
        required: false
      offset_x_adj:
        description: "Horizontal offset adjustment (pixels, can be negative)"
        required: false
        default: "0"
      offset_y_adj:
        description: "Vertical offset adjustment (pixels, can be negative)"
        required: false
        default: "0"

jobs:
  crop_image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # System dependency for magick
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev

      # Setup R (base only)
      - uses: r-lib/actions/setup-r@v2

      # Install magick only
      - name: Install R dependency
        run: |
          Rscript -e 'install.packages("magick", repos = "https://cloud.r-project.org")'

      - name: Crop image
        run: |
          Rscript -e '
            source("scripts/img_helper.R")

            input_path <- "${{ github.event.inputs.input_path }}"
            output_path <- "${{ github.event.inputs.output_path }}"

            offset_x <- as.integer("${{ github.event.inputs.offset_x_adj }}")
            offset_y <- as.integer("${{ github.event.inputs.offset_y_adj }}")

            if (!file.exists(input_path)) {
              stop("Input image does not exist: ", input_path)
            }

            if (nzchar(output_path)) {
              out <- output_path
            } else {
              base <- tools::file_path_sans_ext(input_path)
              out  <- paste0(base, "_sq.png")
            }

            crop_to_square(
              image_path   = input_path,
              output_path  = out,
              offset_x_adj = offset_x,
              offset_y_adj = offset_y
            )

            message("Saved cropped image: ", out)
          '

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.input_path }}" || true
          git add issues/
          git commit -m "Crop image $(basename "${{ github.event.inputs.input_path }}")" || echo "Nothing to commit"
          git push
