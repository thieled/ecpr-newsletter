name: 01-Crop-image

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Exact repo path to image (e.g. issues/2025/20/img/krakow.webp)"
        required: true
      output_path:
        description: "Optional output path (e.g. issues/2025/20/img/krakow_sq.png)"
        required: false
      offset_x_adj:
        description: "Horizontal offset adjustment (pixels, can be negative)"
        required: false
        default: "0"
      offset_y_adj:
        description: "Vertical offset adjustment (pixels, can be negative)"
        required: false
        default: "0"

jobs:
  crop_image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # system deps for magick
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev

      # base R only
      - uses: r-lib/actions/setup-r@v2

      # magick only
      - name: Install R dependency
        run: |
          Rscript -e 'install.packages("magick", repos = "https://cloud.r-project.org")'

      - name: Crop image
        run: |
          Rscript -e '
            source("scripts/img_helper.R")

            input_path  <- "${{ github.event.inputs.input_path }}"
            output_path <- "${{ github.event.inputs.output_path }}"

            offset_x <- as.integer("${{ github.event.inputs.offset_x_adj }}")
            offset_y <- as.integer("${{ github.event.inputs.offset_y_adj }}")

            crop_image_action(
              input_path   = input_path,
              output_path  = output_path,
              offset_x_adj = offset_x,
              offset_y_adj = offset_y
            )
          '

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues/
          git commit -m "Crop image $(basename "${{ github.event.inputs.input_path }}")" || echo "Nothing to commit"
          git push
